<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Rhiwbina Squirrels #1415 Veo Clubhouse cover</title>
  <desc id="desc">Four larger primary sponsor slots in an upper row and two smaller secondary sponsor slots in a right-side lower row, clear of Veo's overlaid team identity. Text labels are omitted because they are unreadable at the 390-pixel preview size.</desc>
  <metadata>Veo Clubhouse cover: 1440x360. Working safe zone: x=120..1320, y=30..330. Left and lower-left areas are reserved for Veo's crest and team-name overlay. Sponsors are grouped primary first, then secondary, alphabetically within each tier.</metadata>
  <defs>
    <style>
      .sponsor-slot { fill: #232323; }
    </style>
  </defs>
  <rect id="background" width="1440" height="360" fill="#1a1a1a"/>

  <g id="primary-sponsors" aria-label="Primary sponsors">
    <g id="sponsor-cornerstone-finance-group">
      <rect class="sponsor-slot" x="316" y="32" width="218" height="136" rx="12"/>
      <image href="../sponsors/cornerstone-finance-group-light.svg" x="323" y="55" width="204" height="90" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <g id="sponsor-hollybush-properties">
      <rect class="sponsor-slot" x="546" y="32" width="218" height="136" rx="12"/>
      <image href="../sponsors/hollybush-properties-light.png" x="560" y="44" width="190" height="112" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <g id="sponsor-imperial">
      <rect class="sponsor-slot" x="776" y="32" width="218" height="136" rx="12"/>
      <image href="../sponsors/imperial-light.png" x="787" y="55" width="196" height="90" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <g id="sponsor-on-the-river">
      <rect class="sponsor-slot" x="1006" y="32" width="218" height="136" rx="12"/>
      <image href="../sponsors/on-the-river-light.png" x="1057" y="42" width="116" height="116" preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>

  <g id="secondary-sponsors" aria-label="Secondary sponsors">
    <g id="sponsor-dc-plastering">
      <rect class="sponsor-slot" x="832" y="184" width="180" height="104" rx="12"/>
      <image href="../sponsors/dc-plastering-light.png" x="840" y="211" width="164" height="50" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <g id="sponsor-est-group">
      <rect class="sponsor-slot" x="1024" y="184" width="180" height="104" rx="12"/>
      <image href="../sponsors/est-group-light.png" x="1039" y="197" width="150" height="78" preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>
</svg>
