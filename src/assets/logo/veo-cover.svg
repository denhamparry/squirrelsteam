<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Rhiwbina Squirrels #1415 Veo Clubhouse cover</title>
  <desc id="desc">Five equal sponsor slots in an upper-right row on a solid dark background, clear of Veo's overlaid team identity.</desc>
  <metadata>Veo Clubhouse cover: 1440x360. Working safe zone: x=120..1320, y=30..330. Left and lower areas are reserved for Veo's crest and team-name overlay. Sponsor order is alphabetical and non-ranking.</metadata>
  <defs>
    <style>
      .sponsor-slot { fill: #232323; }
    </style>
  </defs>
  <rect id="background" width="1440" height="360" fill="#1a1a1a"/>

  <g id="sponsor-cornerstone-finance-group">
    <rect class="sponsor-slot" x="316" y="40" width="188" height="124" rx="12"/>
    <image href="../sponsors/cornerstone-finance-group-light.svg" x="322" y="63" width="176" height="78" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-dc-plastering">
    <rect class="sponsor-slot" x="516" y="40" width="188" height="124" rx="12"/>
    <image href="../sponsors/dc-plastering-light.png" x="522" y="68" width="176" height="68" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-hollybush-properties">
    <rect class="sponsor-slot" x="716" y="40" width="188" height="124" rx="12"/>
    <image href="../sponsors/hollybush-properties-light.png" x="730" y="54" width="160" height="96" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-imperial">
    <rect class="sponsor-slot" x="916" y="40" width="188" height="124" rx="12"/>
    <image href="../sponsors/imperial-light.png" x="925" y="65" width="170" height="74" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-on-the-river">
    <rect class="sponsor-slot" x="1116" y="40" width="188" height="124" rx="12"/>
    <image href="../sponsors/on-the-river-light.png" x="1158" y="50" width="104" height="104" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
