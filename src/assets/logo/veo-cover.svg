<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Rhiwbina Squirrels #1415 Veo Clubhouse cover</title>
  <desc id="desc">Club identity and five equal sponsor slots on a solid dark background.</desc>
  <metadata>Veo Clubhouse cover: 1440x360. Working safe zone: x=120..1320, y=30..330. Sponsor order is alphabetical and non-ranking.</metadata>
  <defs>
    <style>
      .identity { fill: #ffffff; font-family: "Arial", "Helvetica", sans-serif; font-size: 44px; font-weight: 700; letter-spacing: 1px; }
      .section-label { fill: #c6c6c6; font-family: "Arial", "Helvetica", sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 3px; }
      .sponsor-slot { fill: #232323; }
    </style>
  </defs>
  <rect id="background" width="1440" height="360" fill="#1a1a1a"/>

  <g id="club-identity">
    <image href="veo-upper-right-mark.svg" x="120" y="30" width="144" height="144" preserveAspectRatio="xMidYMid meet"/>
    <text class="identity" x="280" y="113">RHIWBINA SQUIRRELS #1415</text>
  </g>
  <text class="section-label" x="120" y="195">OUR SPONSORS</text>

  <g id="sponsor-cornerstone-finance-group">
    <rect class="sponsor-slot" x="120" y="205" width="220" height="112" rx="12"/>
    <image href="../sponsors/cornerstone-finance-group-light.svg" x="128" y="222" width="204" height="78" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-dc-plastering">
    <rect class="sponsor-slot" x="360" y="205" width="220" height="112" rx="12"/>
    <image href="../sponsors/dc-plastering-light.png" x="368" y="227" width="204" height="68" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-hollybush-properties">
    <rect class="sponsor-slot" x="600" y="205" width="220" height="112" rx="12"/>
    <image href="../sponsors/hollybush-properties-light.png" x="620" y="213" width="180" height="96" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-imperial">
    <rect class="sponsor-slot" x="840" y="205" width="220" height="112" rx="12"/>
    <image href="../sponsors/imperial-light.png" x="855" y="224" width="190" height="74" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="sponsor-on-the-river">
    <rect class="sponsor-slot" x="1080" y="205" width="220" height="112" rx="12"/>
    <image href="../sponsors/on-the-river-light.png" x="1140" y="209" width="100" height="104" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
