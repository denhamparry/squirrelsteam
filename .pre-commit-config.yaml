# Pre-commit hooks for the squirrels.team Astro site.
# Install once with `pre-commit install`; CI runs `pre-commit run --all-files`
# on every pull request. See https://pre-commit.com for more information.

repos:
  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys

  # Secret detection
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.1
    hooks:
      - id: markdownlint-cli2
        name: Lint Markdown files

  # Code formatting (.astro, .ts, .mjs, .css) with the repo's .prettierrc.
  # Uses the project's own Prettier, so run `npm install` first.
  - repo: local
    hooks:
      - id: prettier
        name: Format code with Prettier
        entry: npx --no-install prettier --plugin=prettier-plugin-astro --write --ignore-unknown
        language: system
        types_or: [astro, ts, javascript, css]
