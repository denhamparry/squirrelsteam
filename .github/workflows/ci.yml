name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Check, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Show Node.js version
        run: node --version
      - name: Install dependencies
        run: npm ci
      - name: Check Astro project
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build production site
        run: npm run build
      # Production advisories are blocking: deployable dependency regressions
      # should be repaired before an otherwise unrelated pull request merges.
      - name: Audit production dependencies
        run: npm audit --omit=dev

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # The Prettier hook uses the project's own Prettier and Astro plugin.
      - name: Install dependencies
        run: npm ci
      # pipx is preinstalled on GitHub's Ubuntu runners; pin pre-commit so
      # results match local runs.
      - name: Run pre-commit on all files
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure
