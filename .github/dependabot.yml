# Dependabot configuration for automated dependency updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # @astrojs/check accepts TypeScript 5 or 6. Remove this rule when its peer
      # dependency range includes TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
